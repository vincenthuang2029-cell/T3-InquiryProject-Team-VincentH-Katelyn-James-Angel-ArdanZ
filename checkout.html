<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="checkout.css">
    </head>
<body>
    <header class="header">
        <div class="div_1">
            <h1 class ="nav_links">Cafe</h1>
            <img class ="image1" src="assets/coffee-image-by-ali-soltani.jpg" alt="Coffee Logo of Cafe Bazaar by ali soltani in unsplash"/>
            <h1 class ="nav_links">Bazaar</h1>
        </div>
        <nav class="nav">
            <a class ="nav_links" href="home.html">Home</a>
            <a class ="nav_links" href="menu.html">Menu</a>
            <a class ="nav_links" href="delivery.html">Pickup / Delivery</a>
            <a class ="nav_links" href="checkout.html">Checkout</a>
        </nav>
    </header>
    <main>
        <div class="justify_content_heading">
            <h2 class="justify_content_heading-1">Shopping</h2>
            <h2 class="justify_content_heading-2">Cart</h2>
        </div>
        <div class="main-content">
            <div class="items">
                <div class="space">
                    <p class="color">$3 Coffee</p>
                    <div class="description">
                        <img class="image_item" src="assets/coffee-item-by-光术 山影.jpg" alt="coffee item by 光术 山影 in unsplash">
                        <div>
                            <p class="description_color">A premium roasted coffee that uses lactose free milk</p>
                        </div>
                    </div>
                    <div class="item_options">
                        <input class ="option" type="button" value="+"> 
                        <input class ="option" type="button" value="-"> 
                    </div>
                </div>
                <div class="space">
                    <p class="color">$2 Egg Tart</p>
                    <div class="description">
                        <img class="image_item" src="/assets/egg_tart-item-by-KWON JUNHO.jpg" alt="egg tart item by KWON JUNHO in unsplash">
                        <div>
                            <p class="description_color">A egg tart that uses lactose free milk</p>
                        </div>
                    </div>
                    <div class="item_options">
                        <input class ="option" type="button" value="+"> 
                        <input class ="option" type="button" value="-"> 
                    </div>
                </div>
            </div>
            <div class="column">
                <div class="row1">
                    <div class="box1">
                        <h3>#2</h3>
                        <h3>Coffee</h3>
                        <h3>$6.00</h3>
                    </div>
                    <div class="box2">
                        <h3>#1</h3>
                        <h3>Egg Tart</h3>
                        <h3>$2.00</h3>
                    </div>
                </div>
                <div class="row2">
                    <div class="box3">
                        <h3>Sum:</h3>
                        <h3>$8.00</h3>
                    </div>
                    <div class="box3">
                        <h3>Tax:</h3>
                        <h3>$2.00</h3>
                    </div>
                <div class="row3">
                    <div class="box3">
                        <h3>Total:</h3>
                        <h3>$10.00</h3>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
